            `elem`:[''name'']::STRING AS `name`,
            `elem`:[''priority'']::INT AS `priority`,
            `elem`:[''reports_count'']::BIGINT AS `reports_count`,
            `elem`:[''rule_context'']::STRING AS `rule_context`,
            `elem`:[''scope'']::STRING AS `scope`,
            `elem`:[''share_with_cofense'']::BOOLEAN AS `share_with_cofense`,
            TRANSFORM(`elem`:[''tags'']::ARRAY<VARIANT>, elem -> `elem`::STRING) AS `tags`,
