            elem -> STRUCT(
            `elem`:[''active'']::BOOLEAN AS `active`,
            `elem`:[''author_name'']::STRING AS `author_name`,
            `elem`:[''content'']::STRING AS `content`,
            `elem`:[''created_at'']::STRING AS `created_at`,
