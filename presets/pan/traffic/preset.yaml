author: Antimatter
iconURL: "https://dasl-icons.s3.us-east-1.amazonaws.com/pan/traffic/icon.png"
name: pan_traffic
description: Palo Alto Networks Traffic Logs
title: Palo Alto Networks - Traffic Logs
autoloader:
  format: json
bronze:
  loadAsSingleVariant: true
  preTransform: [
    [
      "data", 
      "CAST(data:_time AS FLOAT)::TIMESTAMP AS time", 
      "CAST('pan' AS STRING) AS source", 
      "CAST('traffic' AS STRING) AS sourcetype"
    ]
  ]

