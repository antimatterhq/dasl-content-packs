  - name: datastore_activity
    input: aws_cloudtrail_datastore_activity
    filter: >
      eventName IN ('GetObject','PutObject','DeleteObject','CopyObject','RestoreObject','ListObjects','ListObjectsV2','SelectObjectContent','GetItem','BatchGetItem','Query','Scan','PutItem','UpdateItem','DeleteItem',
                    'BatchWriteItem','ExecuteStatement','BatchExecuteStatement','ExecuteSql','ESHttpGet','ESHttpPost','ESHttpPut','ESHttpDelete','ESHttpHead','StartQueryExecution','GetQueryResults','ReceiveMessage','SendMessage','PutRecord',
                    'GetRecords','PutRecords','StartJobRun','GetJobRun','GetTableObjects','GetWorkUnits','GetWorkUnitResults')
      AND eventSource IN ('s3.amazonaws.com','dynamodb.amazonaws.com','redshift-data.amazonaws.com','rds-data.amazonaws.com','es.amazonaws.com',
                          'athena.amazonaws.com','kinesis.amazonaws.com','sqs.amazonaws.com','glue.amazonaws.com','lakeformation.amazonaws.com')
    fields:
      # ------------ Classification ------------
      - name: activity_id
        expr: |
          CASE
            WHEN eventName IN ('GetObject','GetItem','BatchGetItem','Scan','GetQueryResults','GetJobRun','GetTableObjects','ESHttpGet','ReceiveMessage') THEN 1
            WHEN eventName IN ('UpdateItem') THEN 2
            WHEN eventName IN ('StartJobRun') THEN 3
            WHEN eventName IN ('SelectObjectContent','Query','ExecuteStatement','BatchExecuteStatement','ExecuteSql','StartQueryExecution','GetWorkUnits','GetWorkUnitResults') THEN 4
            WHEN eventName IN ('PutObject','CopyObject','RestoreObject','ESHttpPost','ESHttpPut','SendMessage','PutRecord','PutRecords') THEN 5
            WHEN eventName IN ('PutItem','BatchWriteItem') THEN 6
            WHEN eventName IN ('DeleteObject','DeleteItem','ESHttpDelete') THEN 7
            WHEN eventName IN ('ListObjects','ListObjectsV2','ESHttpHead') THEN 8
            ELSE 0
          END

      - name: activity_name
        expr: |
          CASE
            WHEN eventName IN ('GetObject','GetItem','BatchGetItem','Scan','GetQueryResults','GetJobRun','GetTableObjects','ESHttpGet','ReceiveMessage') THEN 'Read'
            WHEN eventName IN ('UpdateItem') THEN 'Update'
            WHEN eventName IN ('StartJobRun') THEN 'Connect'
            WHEN eventName IN ('SelectObjectContent','Query','ExecuteStatement','BatchExecuteStatement','ExecuteSql','StartQueryExecution','GetWorkUnits','GetWorkUnitResults') THEN 'Query'
            WHEN eventName IN ('PutObject','CopyObject','RestoreObject','ESHttpPost','ESHttpPut','SendMessage','PutRecord','PutRecords') THEN 'Write'
            WHEN eventName IN ('PutItem','BatchWriteItem') THEN 'Create'
            WHEN eventName IN ('DeleteObject','DeleteItem','ESHttpDelete') THEN 'Delete'
            WHEN eventName IN ('ListObjects','ListObjectsV2','ESHttpHead') THEN 'List'
            ELSE 'Unknown'
          END

      - name: category_name
        literal: "Application Activity"

      - name: category_uid
        expr: CAST(6 AS INT)

      - name: class_name
        literal: "Datastore Activity"

      - name: class_uid
        expr: CAST(6005 AS INT)

      - name: message
        expr: NULLIF(CAST(errorMessage AS STRING), '')

      # ------------ Status / severity ------------
      - name: severity
        literal: "Informational"

      - name: severity_id
        expr: CAST(1 AS INT)

      - name: status
        expr: |
          CASE
            WHEN errorCode IS NULL THEN 'Success'
            WHEN errorCode IS NOT NULL THEN 'Failure'
            ELSE 'Unknown'
          END

      - name: status_code
        expr: NULLIF(CAST(errorCode AS STRING), '')

      - name: status_detail
        expr: NULLIF(CAST(errorCode AS STRING), '')

      - name: status_id
        expr: |
          CASE
            WHEN errorCode IS NULL THEN 1
            WHEN errorCode IS NOT NULL THEN 2
            ELSE 0
          END

      # ------------ Timestamps ------------
      - name: time
        expr: to_timestamp(CAST(eventTime AS STRING))

      - name: timezone_offset
        expr: CAST(0 AS INT)

      # ------------ Type naming ------------
      - name: type_name
        expr: |
          CASE
            WHEN eventName IN ('GetObject','GetItem','BatchGetItem','Scan','GetQueryResults','GetRecords','GetJobRun','GetTableObjects','ESHttpGet','ReceiveMessage') THEN 'Read'
            WHEN eventName IN ('UpdateItem') THEN 'Update'
            WHEN eventName IN ('StartJobRun') THEN 'Connect'
            WHEN eventName IN ('SelectObjectContent','Query','ExecuteStatement','BatchExecuteStatement','ExecuteSql','StartQueryExecution','GetWorkUnits','GetWorkUnitResults') THEN 'Query'
            WHEN eventName IN ('PutObject','CopyObject','RestoreObject','ESHttpPost','ESHttpPut','SendMessage','PutRecord','PutRecords') THEN 'Write'
            WHEN eventName IN ('PutItem','BatchWriteItem') THEN 'Create'
            WHEN eventName IN ('DeleteObject','DeleteItem','ESHttpDelete') THEN 'Delete'
            WHEN eventName IN ('ListObjects','ListObjectsV2','ESHttpHead') THEN 'List'
            ELSE 'Unknown'
          END

      - name: type_uid
        expr: |
          CAST(
            CASE
              WHEN eventName IN ('GetObject','GetItem','BatchGetItem','Scan','GetQueryResults','GetRecords','GetJobRun','GetTableObjects','ESHttpGet','ReceiveMessage') THEN 600501
              WHEN eventName IN ('UpdateItem') THEN 600502
              WHEN eventName IN ('StartJobRun') THEN 600503
              WHEN eventName IN ('SelectObjectContent','Query','ExecuteStatement','BatchExecuteStatement','ExecuteSql','StartQueryExecution','GetWorkUnits','GetWorkUnitResults') THEN 600504
              WHEN eventName IN ('PutObject','CopyObject','RestoreObject','ESHttpPost','ESHttpPut','SendMessage','PutRecord','PutRecords') THEN 600505
              WHEN eventName IN ('PutItem','BatchWriteItem') THEN 600506
              WHEN eventName IN ('DeleteObject','DeleteItem','ESHttpDelete') THEN 600507
              WHEN eventName IN ('ListObjects','ListObjectsV2','ESHttpHead') THEN 600508
              ELSE 600500
            END
          AS BIGINT)

      # ------------ API (exact table shape) ------------
      - name: api
        expr: |
          struct(
            CAST(eventName AS STRING) AS operation,
            struct(
              CAST(to_json(NULL) AS VARIANT) AS data,
              NULLIF(CAST(requestID AS STRING), '') AS uid
            ) AS request,
            struct(
              CAST(NULL AS INT) AS code,
              CAST(to_json(NULL) AS VARIANT) AS data,
              NULLIF(CAST(errorCode AS STRING), '') AS error,
              NULLIF(CAST(errorMessage AS STRING), '') AS message
            ) AS response
          )

      # ------------ Cloud (includes cloud_partition) ------------
      - name: cloud
        expr: |
          struct(
            struct(
              CAST(NULL AS STRING) AS name,
              COALESCE(CAST(recipientAccountId AS STRING), CAST(userIdentity.accountId AS STRING)) AS uid
            ) AS account,
            CASE
              WHEN CAST(awsRegion AS STRING) LIKE 'cn-%' THEN 'aws-cn'
              WHEN CAST(awsRegion AS STRING) LIKE 'us-gov-%' THEN 'aws-us-gov'
              ELSE 'aws'
            END AS cloud_partition,
            CAST(CAST(recipientAccountId AS STRING) AS STRING) AS project_uid,
            'AWS' AS provider,
            NULLIF(CAST(awsRegion AS STRING), '') AS region,
            CAST(NULL AS STRING) AS zone
          )

      # ------------ Actor (schema-accurate) ------------
      - name: actor
        expr: |
          struct(
            NULLIF(CAST(userAgent AS STRING), '') AS app_name,
            NULLIF(CAST(userIdentity.accessKeyId AS STRING), '') AS app_uid,
            ARRAY(
              NAMED_STRUCT('decision',
                CASE WHEN CAST(errorCode AS STRING) IS NULL OR CAST(errorCode AS STRING) = '' THEN 'allowed' ELSE 'denied' END
              )
            ) AS authorizations,
            struct(
              CAST(NULL AS STRING) AS domain,
              CAST(NULL AS STRING) AS name,
              CAST(NULL AS STRING) AS protocol_name,
              CAST(NULL AS STRING) AS tenant_uid,
              CAST(NULL AS STRING) AS uid
            ) AS idp,
            struct(
              CAST(NULL AS STRING) AS cmd_line,
              CAST(NULL AS STRING) AS cpid,
              CAST(NULL AS STRING) AS name,
              CAST(NULL AS INT) AS pid,
              struct(
                CAST(NULL AS TIMESTAMP) AS created_time,
                CAST(NULL AS STRING) AS credential_uid,
                CAST(NULL AS STRING) AS expiration_reason,
                CAST(NULL AS TIMESTAMP) AS expiration_time,
                CAST(NULL AS BOOLEAN) AS is_mfa,
                CAST(NULL AS BOOLEAN) AS is_remote,
                CAST(NULL AS BOOLEAN) AS is_vpn,
                CAST(NULL AS STRING) AS issuer,
                CAST(NULL AS STRING) AS terminal,
                CAST(NULL AS STRING) AS uid,
                CAST(NULL AS STRING) AS uid_alt,
                CAST(NULL AS STRING) AS uuid
              ) AS session,
              CAST(NULL AS STRING) AS uid,
              struct(
                CAST(NULL AS BOOLEAN) AS has_mfa,
                CAST(NULL AS STRING)  AS name,
                CAST(NULL AS STRING)  AS type,
                CAST(NULL AS INT)     AS type_id,
                CAST(NULL AS STRING)  AS uid
              ) AS user
            ) AS process,
            struct(
              CAST(userIdentity.sessionContext.attributes.mfaAuthenticated AS BOOLEAN) AS has_mfa,
              NULLIF(CAST(userIdentity.userName AS STRING), '') AS name,
              NULLIF(CAST(userIdentity.type AS STRING), '') AS type,
              CAST(NULL AS INT) AS type_id,
              NULLIF(CAST(userIdentity.principalId AS STRING), '') AS uid
            ) AS user
          )

      # ------------ Databucket ------------
      - name: databucket
        expr: |
          struct(
            CAST(NULL AS TIMESTAMP) AS created_time,
            CAST(NULL AS STRING) AS desc,
            struct(
              CAST(NULL AS STRING) AS name,
              CAST(NULL AS STRING) AS path
            ) AS file,
            CAST(array() AS ARRAY<STRUCT<name: STRING, privileges: STRING, type: STRING, uid: STRING>>) AS groups,
            CAST(NULL AS BOOLEAN) AS is_encrypted,
            CAST(NULL AS BOOLEAN) AS is_public,
            CAST(NULL AS TIMESTAMP) AS modified_time,
            CASE
              WHEN eventSource = 's3.amazonaws.com' THEN
                COALESCE(
                  get_json_object(CAST(requestParameters AS STRING), '$.bucketName'),
                  get_json_object(CAST(requestParameters AS STRING), '$.bucket')
                )
              WHEN eventSource = 'athena.amazonaws.com' THEN
                get_json_object(CAST(requestParameters AS STRING), '$.queryExecutionContext.database')
              WHEN eventSource = 'glue.amazonaws.com' THEN
                get_json_object(CAST(requestParameters AS STRING), '$.databaseName')
              WHEN eventSource = 'lakeformation.amazonaws.com' THEN
                get_json_object(CAST(requestParameters AS STRING), '$.resource.databaseName')
              WHEN eventSource = 'dynamodb.amazonaws.com' THEN
                get_json_object(CAST(requestParameters AS STRING), '$.tableName')
              WHEN eventSource = 'es.amazonaws.com' THEN
                split_part(get_json_object(CAST(requestParameters AS STRING), '$.path'), '/', 2)
              ELSE NULL
            END AS name,
            CAST(NULL AS BIGINT) AS size,
            CAST(NULL AS STRING) AS type,
            CAST(NULL AS INT) AS type_id,
            CAST(NULL AS STRING) AS uid
          )

      # ------------ Database & Table ------------
      - name: database
        expr: |
          struct(
            CAST(NULL AS STRING) AS desc,
            CAST(NULL AS TIMESTAMP) AS modified_time,
            CAST(NULL AS STRING) AS name,
            CAST(NULL AS STRING) AS type,
            CAST(NULL AS INT) AS type_id,
            CAST(NULL AS STRING) AS uid
          )

      - name: table
        expr: |
          struct(
            CAST(NULL AS STRING) AS name,
            CAST(NULL AS STRING) AS uid,
            CAST(NULL AS TIMESTAMP) AS created_time,
            CAST(NULL AS STRING) AS desc,
            CAST(array() AS ARRAY<STRUCT<name: STRING, privileges: STRING, type: STRING, uid: STRING>>) AS groups,
            CAST(NULL AS TIMESTAMP) AS modified_time,
            CAST(NULL AS BIGINT) AS size
          )

      # ------------ Destination / Source endpoints (full shapes) ------------
      - name: dst_endpoint.domain
        expr: CAST(NULL AS STRING)
      - name: dst_endpoint.hostname
        expr: split_part(CAST(eventSource AS STRING), '.', 1)
      - name: dst_endpoint.instance_uid
        expr: CAST(NULL AS STRING)
      - name: dst_endpoint.interface_name
        expr: CAST(NULL AS STRING)
      - name: dst_endpoint.interface_uid
        expr: CAST(NULL AS STRING)
      - name: dst_endpoint.ip
        expr: CAST(NULL AS STRING)
      - name: dst_endpoint.name
        expr: COALESCE(CAST(tlsDetails.clientProvidedHostHeader AS STRING), CAST(eventSource AS STRING))
      - name: dst_endpoint.port
        expr: CAST(NULL AS INT)
      - name: dst_endpoint.svc_name
        expr: split_part(CAST(eventSource AS STRING), '.', 1)
      - name: dst_endpoint.type
        literal: "Unknown"
      - name: dst_endpoint.type_id
        expr: CAST(0 AS INT)
      - name: dst_endpoint.uid
        expr: CAST(NULL AS STRING)
      - name: dst_endpoint.location
        expr: |
          named_struct(
            'city',        CAST(NULL AS STRING),
            'continent',   CAST(NULL AS STRING),
            'country',     CAST(NULL AS STRING),
            'lat',         CAST(NULL AS FLOAT),
            'long',        CAST(NULL AS FLOAT),
            'postal_code', CAST(NULL AS STRING)
          )
      - name: dst_endpoint.mac
        expr: CAST(NULL AS STRING)
      - name: dst_endpoint.vpc_uid
        expr: CAST(NULL AS STRING)
      - name: dst_endpoint.zone
        expr: CAST(NULL AS STRING)

      - name: src_endpoint.domain
        expr: CAST(NULL AS STRING)
      - name: src_endpoint.hostname
        expr: CAST(NULL AS STRING)
      - name: src_endpoint.instance_uid
        expr: CAST(NULL AS STRING)
      - name: src_endpoint.interface_name
        expr: CAST(NULL AS STRING)
      - name: src_endpoint.interface_uid
        expr: NULLIF(CAST(vpcEndpointId AS STRING), '')
      - name: src_endpoint.ip
        expr: NULLIF(CAST(sourceIPAddress AS STRING), '')
      - name: src_endpoint.name
        expr: CAST(NULL AS STRING)
      - name: src_endpoint.port
        expr: CAST(NULL AS INT)
      - name: src_endpoint.svc_name
        expr: CAST(NULL AS STRING)
      - name: src_endpoint.type
        literal: "Unknown"
      - name: src_endpoint.type_id
        expr: CAST(0 AS INT)
      - name: src_endpoint.uid
        expr: CAST(NULL AS STRING)
      - name: src_endpoint.location
        expr: |
          named_struct(
            'city',        CAST(NULL AS STRING),
            'continent',   CAST(NULL AS STRING),
            'country',     CAST(NULL AS STRING),
            'lat',         CAST(NULL AS FLOAT),
            'long',        CAST(NULL AS FLOAT),
            'postal_code', CAST(NULL AS STRING)
          )
      - name: src_endpoint.mac
        expr: CAST(NULL AS STRING)
      - name: src_endpoint.vpc_uid
        expr: CAST(NULL AS STRING)
      - name: src_endpoint.zone
        expr: CAST(NULL AS STRING)

      # ------------ HTTP request/response (exact shapes) ------------
      - name: http_request
        expr: |
          struct(
            CAST(requestParameters AS STRING) AS args,
            CASE WHEN requestParameters IS NOT NULL THEN LENGTH(to_json(requestParameters)) ELSE NULL END AS body_length,
            CAST(array() AS ARRAY<STRUCT<name: STRING, value: STRING>>) AS http_headers,
            CAST(NULL AS STRING) AS http_method,
            CAST(NULL AS INT) AS length,
            CAST(NULL AS STRING) AS referrer,
            COALESCE(CAST(tlsDetails.clientProvidedHostHeader AS STRING), CAST(eventSource AS STRING)) AS url,
            CAST(userAgent AS STRING) AS user_agent,
            CAST(NULL AS STRING) AS version
          )

      - name: http_response
        expr: |
          struct(
            CAST(NULL AS INT) AS body_length,
            CAST(NULL AS INT) AS code,
            CAST(NULL AS STRING) AS content_type,
            CAST(array() AS ARRAY<STRUCT<name: STRING, value: STRING>>) AS http_headers,
            CAST(NULL AS INT) AS latency,
            CAST(NULL AS INT) AS length,
            CAST(NULL AS STRING) AS message,
            CAST(NULL AS STRING) AS status
          )

      # ------------ Metadata ------------
      - name: metadata
        expr: |
          struct(
            CAST(sharedEventID AS STRING) AS correlation_uid,
            CAST(eventName AS STRING) AS event_code,
            'Informational' AS log_level,
            'cloudtrail' AS log_name,
            'AWS' AS log_provider,
            NULLIF(CAST(eventVersion AS STRING), '') AS log_version,
            to_timestamp(CAST(eventTime AS STRING)) AS logged_time,
            CAST(NULL AS TIMESTAMP) AS modified_time,
            CAST(eventTime AS STRING) AS original_time,
            current_timestamp() AS processed_time,
            struct(
              NULLIF(CAST(eventSource AS STRING), '') AS name,
              'AWS' AS vendor_name,
              NULLIF(CAST(eventVersion AS STRING), '') AS version
            ) AS product,
            CAST(NULL AS VARIANT) AS tags,
            NULLIF(CAST(recipientAccountId AS STRING), '') AS tenant_uid,
            CAST(eventID AS STRING) AS uid,
            CAST(NULL AS STRING) AS version
          )

      # ------------ Disposition / action (normalized) ------------
      - name: disposition
        expr: |
          CASE WHEN CAST(errorCode AS STRING) IS NULL OR CAST(errorCode AS STRING) = '' THEN 'Allowed' ELSE 'Error' END

      - name: disposition_id
        expr: |
          CASE WHEN CAST(errorCode AS STRING) IS NULL OR CAST(errorCode AS STRING) = '' THEN 1 ELSE 27 END

      - name: action
        expr: |
          CASE
            WHEN eventSource IN ('s3.amazonaws.com','dynamodb.amazonaws.com','rds.amazonaws.com','glacier.amazonaws.com','ecr.amazonaws.com','athena.amazonaws.com','es.amazonaws.com','lakeformation.amazonaws.com','glue.amazonaws.com')
                 AND (eventName LIKE 'Get%' OR eventName LIKE 'Describe%' OR eventName LIKE 'List%')
            THEN CASE
                   WHEN errorCode IS NULL THEN 'Allowed'
                   WHEN errorCode IN ('LimitExceeded','OptInRequired','ThrottlingException','AccessDenied','AccessDeniedException','InvalidAccessException','NotAuthorized','UnauthorizedOperation') THEN 'Denied'
                   ELSE 'Unknown'
                 END
            ELSE NULL
          END

      - name: action_id
        expr: |
          CASE
            WHEN eventSource IN ('s3.amazonaws.com','dynamodb.amazonaws.com','rds.amazonaws.com','glacier.amazonaws.com','ecr.amazonaws.com','athena.amazonaws.com','es.amazonaws.com','lakeformation.amazonaws.com','glue.amazonaws.com')
                 AND (eventName LIKE 'Get%' OR eventName LIKE 'Describe%' OR eventName LIKE 'List%')
            THEN CASE
                   WHEN errorCode IS NULL THEN 1
                   WHEN errorCode IN ('LimitExceeded','OptInRequired','ThrottlingException','AccessDenied','AccessDeniedException','InvalidAccessException','NotAuthorized','UnauthorizedOperation') THEN 2
                   ELSE 0
                 END
            ELSE NULL
          END

      # ------------ Arrays ------------
      - name: enrichments
        expr: |
          CAST(array() AS ARRAY<STRUCT<data: VARIANT, desc: STRING, name: STRING, value: STRING>>)

      - name: observables
        expr: |
          CAST(array() AS ARRAY<STRUCT<name: STRING, type: STRING, value: STRING>>)

      # ------------ Raw / Unmapped ------------
      - name: raw_data
        expr: |
          CAST(to_json(struct(*)) AS VARIANT)

      # ------------ Optional type fields present in table ------------
      - name: type
        expr: CAST(NULL AS STRING)

      - name: type_id
        expr: CAST(NULL AS INT)
