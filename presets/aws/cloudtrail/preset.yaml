        - expr: '`data`:[''userIdentity'']:[''sessionContext'']:[''attributes'']:[''creationDate'']::STRING'
          name: userIdentity.sessionContext.attributes.creationDate
        - expr: '`data`:[''userIdentity'']:[''sessionContext'']:[''sessionIssuer'']:[''userName'']::STRING'
          name: userIdentity.sessionContext.sessionIssuer.userName
        - expr: '`data`:[''userIdentity'']:[''sessionContext'']:[''sessionIssuer'']:[''type'']::STRING'
          name: userIdentity.sessionContext.sessionIssuer.type
        - expr: '`data`:[''userIdentity'']:[''sessionContext'']:[''sessionIssuer'']:[''arn'']::STRING'
          name: userIdentity.sessionContext.sessionIssuer.arn
        - expr: '`data`:[''userIdentity'']:[''sessionContext'']:[''sessionIssuer'']:[''principalId'']::STRING'
          name: userIdentity.sessionContext.sessionIssuer.principalId
        - expr: '`data`:[''userIdentity'']:[''sessionContext'']:[''sessionIssuer'']:[''accountId'']::STRING'
          name: userIdentity.sessionContext.sessionIssuer.accountId
        - expr: '`data`:[''userAgent'']::STRING'
          name: userAgent
        - expr: '`data`:[''managementEvent'']::BOOLEAN'
          name: managementEvent
        - expr: '`data`:[''eventName'']::STRING'
          name: eventName
        - expr: '`data`:[''eventID'']::STRING'
          name: eventID
        - expr: '`data`:[''eventCategory'']::STRING'
          name: eventCategory
        - expr: '`data`:[''userIdentity'']:[''userName'']::STRING'
          name: userIdentity.userName
      filter: data:eventName::string IN ('AssumeRole')
      name: aws_cloudtrail_authorize_session

gold:
  - name: entity_management
    input: aws_cloudtrail_entity_management
    fields:
      # -------------------- Core classification --------------------
      - name: activity_id
        expr: |
          CASE
            WHEN eventName LIKE 'Create%' THEN 1
            WHEN eventName LIKE 'Get%' OR eventName LIKE 'List%' OR eventName LIKE 'Describe%' THEN 2
            WHEN eventName IN (
              'UpdateUser','UpdateGroup','UpdateRole','ChangePassword','UpdateLoginProfile',
              'PutUserPolicy','PutGroupPolicy','PutRolePolicy',
              'AttachUserPolicy','AttachGroupPolicy','AttachRolePolicy',
              'AddUserToGroup','RemoveUserFromGroup',
              'ResetServiceSpecificCredential','UpdateAssumeRolePolicy'
            ) THEN 3
            WHEN eventName LIKE 'Delete%' THEN 4
            WHEN eventName IN ('RenameGroup','RenameUser') THEN 5
            WHEN eventName IN ('EnableMFADevice','CreateVirtualMFADevice') THEN 6
            WHEN eventName IN ('DeactivateMFADevice','DeleteVirtualMFADevice') THEN 7
            WHEN eventName IN ('EnableUser') THEN 8
            WHEN eventName IN ('DisableUser') THEN 9
            WHEN eventName IN ('ActivateMFADevice') THEN 10
            WHEN eventName IN ('DeactivateMFADevice') THEN 11
            WHEN eventName IN ('SuspendUser') THEN 12
            WHEN eventName IN ('ResumeUser') THEN 13
            ELSE 99
          END

      - name: activity_name
        expr: |
          CASE
            WHEN eventName LIKE 'Create%' THEN 'Create'
            WHEN eventName LIKE 'Get%' OR eventName LIKE 'List%' OR eventName LIKE 'Describe%' THEN 'Read'
            WHEN eventName IN (
              'UpdateUser','UpdateGroup','UpdateRole','ChangePassword','UpdateLoginProfile',
              'PutUserPolicy','PutGroupPolicy','PutRolePolicy',
              'AttachUserPolicy','AttachGroupPolicy','AttachRolePolicy',
              'AddUserToGroup','RemoveUserFromGroup',
              'ResetServiceSpecificCredential','UpdateAssumeRolePolicy'
            ) THEN 'Update'
            WHEN eventName LIKE 'Delete%' THEN 'Delete'
            WHEN eventName IN ('RenameGroup','RenameUser') THEN 'Move'
            WHEN eventName IN ('EnableMFADevice','CreateVirtualMFADevice') THEN 'Enroll'
            WHEN eventName IN ('DeactivateMFADevice','DeleteVirtualMFADevice') THEN 'Unenroll'
            WHEN eventName IN ('EnableUser') THEN 'Enable'
            WHEN eventName IN ('DisableUser') THEN 'Disable'
            WHEN eventName IN ('ActivateMFADevice') THEN 'Activate'
            WHEN eventName IN ('DeactivateMFADevice') THEN 'Deactivate'
            WHEN eventName IN ('SuspendUser') THEN 'Suspend'
            WHEN eventName IN ('ResumeUser') THEN 'Resume'
            ELSE 'Other'
          END

      - name: category_name
        literal: "Identity & Access Management"

      - name: category_uid
        expr: CAST(3 AS INT)

      - name: class_name
        literal: "Entity Management"

      - name: class_uid
        expr: CAST(3004 AS INT)

      # -------------------- Outcome / status --------------------
      - name: action
        expr: |
          CASE
            WHEN errorCode IS NULL OR CAST(errorCode AS STRING) = '' THEN 'Allowed'
            WHEN CAST(errorCode AS STRING) IN ('LimitExceeded','OptInRequired','ThrottlingException','AccessDenied','AccessDeniedException','InvalidAccessException','NotAuthorized') THEN 'Denied'
            ELSE 'Unknown'
          END

      - name: action_id
        expr: |
          CASE
            WHEN errorCode IS NULL OR CAST(errorCode AS STRING) = '' THEN 1
            WHEN CAST(errorCode AS STRING) IN ('LimitExceeded','OptInRequired','ThrottlingException','AccessDenied','AccessDeniedException','InvalidAccessException','NotAuthorized') THEN 2
            ELSE 0
          END

      - name: disposition
        expr: |
          CASE
            WHEN errorCode IS NULL OR CAST(errorCode AS STRING) = '' THEN 'Allowed'
            ELSE 'Error'
          END

      - name: disposition_id
        expr: |
          CASE
            WHEN errorCode IS NULL OR CAST(errorCode AS STRING) = '' THEN 1
            ELSE 27
          END

      - name: status
        expr: |
          CASE
            WHEN errorCode IS NULL OR CAST(errorCode AS STRING) = '' THEN 'Success'
            ELSE 'Failure'
          END

      - name: status_code
        expr: NULLIF(CAST(errorCode AS STRING), '')

      - name: status_detail
        expr: NULLIF(CAST(errorMessage AS STRING), '')

      - name: status_id
        expr: |
          CASE
            WHEN errorCode IS NULL OR CAST(errorCode AS STRING) = '' THEN 1
            ELSE 2
          END

      # -------------------- Time --------------------
      - name: time
        expr: to_timestamp(CAST(eventTime AS STRING))

      - name: timezone_offset
        expr: CAST(0 AS INT)

      # -------------------- Type naming --------------------
      - name: type_name
        expr: |
          CASE
            WHEN eventName LIKE 'Create%' THEN 'Create'
            WHEN eventName LIKE 'Get%' OR eventName LIKE 'List%' OR eventName LIKE 'Describe%' THEN 'Read'
            WHEN eventName LIKE 'Delete%' THEN 'Delete'
            WHEN eventName IN ('RenameUser','RenameGroup') THEN 'Move'
            WHEN eventName IN ('EnableMFADevice','CreateVirtualMFADevice') THEN 'Enroll'
            WHEN eventName IN ('DeactivateMFADevice','DeleteVirtualMFADevice') THEN 'Unenroll'
            WHEN eventName IN ('EnableUser') THEN 'Enable'
            WHEN eventName IN ('DisableUser') THEN 'Disable'
            WHEN eventName IN ('ActivateMFADevice') THEN 'Activate'
            WHEN eventName IN ('DeactivateMFADevice') THEN 'Deactivate'
            WHEN eventName IN ('SuspendUser') THEN 'Suspend'
            WHEN eventName IN ('ResumeUser') THEN 'Resume'
            ELSE 'Unknown'
          END

      - name: type_uid
        expr: |
          CAST(3004 * 100 + CASE
            WHEN eventName LIKE 'Create%' THEN 1
            WHEN eventName LIKE 'Get%' OR eventName LIKE 'List%' OR eventName LIKE 'Describe%' THEN 2
            WHEN eventName IN (
              'UpdateUser', 'UpdateGroup', 'ChangePassword', 'AttachUserPolicy', 'PutUserPolicy',
              'AddUserToGroup', 'RemoveUserFromGroup'
            ) THEN 3
            WHEN eventName LIKE 'Delete%' THEN 4
            WHEN eventName IN ('RenameUser', 'RenameGroup') THEN 5
            WHEN eventName IN ('EnableMFADevice', 'CreateVirtualMFADevice') THEN 6
            WHEN eventName IN ('DeactivateMFADevice', 'DeleteVirtualMFADevice') THEN 7
            WHEN eventName IN ('EnableUser') THEN 8
            WHEN eventName IN ('DisableUser') THEN 9
            WHEN eventName IN ('ActivateMFADevice') THEN 10
            WHEN eventName IN ('DeactivateMFADevice') THEN 11
            WHEN eventName IN ('SuspendUser') THEN 12
            WHEN eventName IN ('ResumeUser') THEN 13
            ELSE 0
          END AS BIGINT)

      # -------------------- API (exact shape) --------------------
      - name: api
        expr: |
          struct(
            CAST(eventName AS STRING) AS operation,
            struct(
              CAST(to_json(requestParameters) AS VARIANT) AS data,
              CAST(requestID AS STRING) AS uid
            ) AS request,
            struct(
              CAST(NULL AS INT) AS code,
              CAST(to_json(NULL) AS VARIANT) AS data,
              NULLIF(CAST(errorCode AS STRING), '') AS error,
              NULLIF(CAST(errorMessage AS STRING), '') AS message
            ) AS response
          )

      # -------------------- Cloud (account is STRUCT) --------------------
      - name: cloud
        expr: |
          struct(
            struct(
              CAST(NULL AS STRING) AS name,
              COALESCE(CAST(recipientAccountId AS STRING), CAST(userIdentity.accountId AS STRING)) AS uid
            ) AS account,
            CASE
              WHEN CAST(awsRegion AS STRING) LIKE 'cn-%' THEN 'aws-cn'
              WHEN CAST(awsRegion AS STRING) LIKE 'us-gov-%' THEN 'aws-us-gov'
              ELSE 'aws'
            END AS cloud_partition,
            CAST(NULL AS STRING) AS project_uid,
            'AWS' AS provider,
            NULLIF(CAST(awsRegion AS STRING), '') AS region,
            CAST(NULL AS STRING) AS zone
          )

      # -------------------- Actor (schema-accurate) --------------------
      - name: actor
        expr: |
          struct(
            NULLIF(CAST(userAgent AS STRING), '') AS app_name,
            NULLIF(CAST(userIdentity.accessKeyId AS STRING), '') AS app_uid,
            ARRAY(
              NAMED_STRUCT('decision',
                CASE WHEN CAST(errorCode AS STRING) IS NULL OR CAST(errorCode AS STRING) = '' THEN 'allowed' ELSE 'denied' END
              )
            ) AS authorizations,
            struct(
              CAST(NULL AS STRING) AS domain,
              CAST(NULL AS STRING) AS name,
              CAST(NULL AS STRING) AS protocol_name,
              CAST(NULL AS STRING) AS tenant_uid,
              CAST(NULL AS STRING) AS uid
            ) AS idp,
            struct(
              CAST(NULL AS STRING) AS cmd_line,
              CAST(NULL AS STRING) AS cpid,
              CAST(NULL AS STRING) AS name,
              CAST(NULL AS INT) AS pid,
              struct(
                CAST(NULL AS TIMESTAMP) AS created_time,
                CAST(NULL AS STRING) AS credential_uid,
                CAST(NULL AS STRING) AS expiration_reason,
                CAST(NULL AS TIMESTAMP) AS expiration_time,
                CAST(NULL AS BOOLEAN) AS is_mfa,
                CAST(NULL AS BOOLEAN) AS is_remote,
                CAST(NULL AS BOOLEAN) AS is_vpn,
                CAST(NULL AS STRING) AS issuer,
                CAST(NULL AS STRING) AS terminal,
                CAST(NULL AS STRING) AS uid,
                CAST(NULL AS STRING) AS uid_alt,
                CAST(NULL AS STRING) AS uuid
              ) AS session,
              CAST(NULL AS STRING) AS uid,
              struct(
                CAST(NULL AS BOOLEAN) AS has_mfa,
                CAST(NULL AS STRING)  AS name,
                CAST(NULL AS STRING)  AS type,
                CAST(NULL AS INT)     AS type_id,
                CAST(NULL AS STRING)  AS uid
              ) AS user
            ) AS process,
            struct(
              CAST(userIdentity.sessionContext.attributes.mfaAuthenticated AS BOOLEAN) AS has_mfa,
              NULLIF(CAST(userIdentity.userName AS STRING), '') AS name,
              NULLIF(CAST(userIdentity.type AS STRING), '') AS type,
              CAST(NULL AS INT) AS type_id,
              NULLIF(CAST(userIdentity.principalId AS STRING), '') AS uid
            ) AS user
          )

      # -------------------- Entity (exact table shape) --------------------
      - name: entity
        expr: |
          struct(
            CASE
              WHEN eventName IN ('GetInstanceProfile') THEN NULLIF(get_json_object(CAST(requestParameters AS STRING), '$.instanceProfileName'), '')
              WHEN eventName IN ('ListMFADevices','GetUser','GetLoginProfile','ListSSHPublicKeys') THEN NULLIF(get_json_object(CAST(requestParameters AS STRING), '$.userName'), '')
              WHEN eventName IN ('DescribeRoleAlias') THEN NULLIF(get_json_object(CAST(requestParameters AS STRING), '$.roleAlias'), '')
              WHEN eventName IN ('GetGroupPolicy') THEN COALESCE(
                NULLIF(get_json_object(CAST(requestParameters AS STRING), '$.groupName'), ''),
                NULLIF(get_json_object(CAST(requestParameters AS STRING), '$.policyName'), '')
              )
              WHEN eventName IN ('GetUserPolicy') THEN NULLIF(get_json_object(CAST(requestParameters AS STRING), '$.policyName'), '')
              WHEN eventName IN ('GetGroup') THEN NULLIF(get_json_object(CAST(requestParameters AS STRING), '$.groupIdentifier'), '')
              ELSE NULL
            END AS name,
            CAST(NULL AS STRING) AS uid,
            CAST(to_json(requestParameters) AS VARIANT) AS data,
            struct(CAST(NULL AS STRING) AS to) AS email,
            struct(
              CAST(NULL AS STRING) AS name,
              CAST(NULL AS STRING) AS privileges,
              CAST(NULL AS STRING) AS type,
              CAST(NULL AS STRING) AS uid
            ) AS `group`,
            struct(
              CAST(NULL AS STRING) AS city,
              CAST(NULL AS STRING) AS continent,
              CAST(NULL AS STRING) AS country,
              CAST(NULL AS FLOAT)  AS lat,
              CAST(NULL AS FLOAT)  AS long,
              CAST(NULL AS STRING) AS postal_code
            ) AS location,
            CAST(array() AS ARRAY<STRUCT<is_applied: BOOLEAN, name: STRING, uid: STRING, version: STRING>>) AS policies,
            CASE
              WHEN eventName IN ('GetInstanceProfile') THEN 'InstanceProfile'
              WHEN eventName IN ('ListMFADevices','GetUser','GetLoginProfile','ListSSHPublicKeys') THEN 'User'
              WHEN eventName IN ('DescribeRoleAlias') THEN 'RoleAlias'
              WHEN eventName IN ('GetGroupPolicy','GetUserPolicy','GetKeyPolicy','GetPolicyVersion') THEN 'Policy'
              WHEN eventName IN ('GetGroup') THEN 'Group'
              ELSE NULL
            END AS type,
            CASE
              WHEN eventName IN ('GetInstanceProfile','DescribeRoleAlias') THEN 99
              WHEN eventName IN ('ListMFADevices','GetUser','GetLoginProfile','ListSSHPublicKeys') THEN 2
              WHEN eventName IN ('GetGroupPolicy','GetUserPolicy','GetKeyPolicy','GetPolicyVersion') THEN 5
              WHEN eventName IN ('GetGroup') THEN 3
              ELSE NULL
            END AS type_id,
            struct(
              CAST(NULL AS BOOLEAN) AS has_mfa,
              CAST(NULL AS STRING)  AS name,
              CAST(NULL AS STRING)  AS type,
              CAST(NULL AS INT)     AS type_id,
              CAST(NULL AS STRING)  AS uid
            ) AS user,
            CASE
              WHEN eventName IN ('GetPolicyVersion') THEN NULLIF(get_json_object(CAST(requestParameters AS STRING), '$.versionId'), '')
              ELSE NULL
            END AS version
          )

      - name: entity_result
        expr: |
          CAST(NULL AS STRUCT<
            name: STRING,
            uid: STRING,
            data: VARIANT,
            email: STRUCT<to: STRING>,
            `group`: STRUCT<name: STRING, privileges: STRING, type: STRING, uid: STRING>,
            location: STRUCT<city: STRING, continent: STRING, country: STRING, lat: FLOAT, long: FLOAT, postal_code: STRING>,
            policies: ARRAY<STRUCT<is_applied: BOOLEAN, name: STRING, uid: STRING, version: STRING>>,
            type: STRING,
            type_id: INT,
            user: STRUCT<has_mfa: BOOLEAN, name: STRING, type: STRING, type_id: INT, uid: STRING>,
            version: STRING
          >)

      # -------------------- Device (STRUCT in table) --------------------
      - name: device
        expr: |
          struct(
            CAST(NULL AS TIMESTAMP) AS created_time,
            CAST(NULL AS STRING) AS desc,
            CAST(NULL AS STRING) AS domain,
            CAST(array() AS ARRAY<STRUCT<name: STRING, privileges: STRING, type: STRING, uid: STRING>>) AS groups,
            CAST(NULL AS STRING) AS hostname,
            CAST(NULL AS STRING) AS ip,
            CAST(NULL AS BOOLEAN) AS is_compliant,
            CAST(NULL AS BOOLEAN) AS is_managed,
            CAST(NULL AS BOOLEAN) AS is_personal,
            CAST(NULL AS BOOLEAN) AS is_trusted,
            CAST(NULL AS STRING) AS name,
            CAST(NULL AS STRING) AS region,
            CAST(NULL AS STRING) AS risk_level,
            CAST(NULL AS INT) AS risk_level_id,
            CAST(NULL AS INT) AS risk_score,
            CAST(NULL AS STRING) AS subnet,
            CAST(NULL AS STRING) AS type,
            CAST(NULL AS INT) AS type_id,
            CAST(NULL AS STRING) AS uid
          )

      # -------------------- Arrays present in schema --------------------
      - name: enrichments
        expr: |
          CAST(array() AS ARRAY<STRUCT<data: VARIANT, desc: STRING, name: STRING, value: STRING>>)

      - name: observables
        expr: |
          CAST(array() AS ARRAY<STRUCT<name: STRING, type: STRING, value: STRING>>)

      # -------------------- Misc --------------------
      - name: message
        expr: NULLIF(CAST(errorMessage AS STRING), '')

      - name: access_list
        expr: |
          CAST(array() AS ARRAY<STRING>)

      - name: access_mask
        expr: CAST(NULL AS INT)

      - name: comment
        expr: CAST(NULL AS STRING)

      # -------------------- Metadata --------------------
      - name: metadata
        expr: |
          struct(
            CAST(sharedEventID AS STRING) AS correlation_uid,
            CAST(eventName AS STRING) AS event_code,
            'Informational' AS log_level,
            'Cloudtrail' AS log_name,
            'AWS' AS log_provider,
            NULLIF(CAST(eventVersion AS STRING), '') AS log_version,
            to_timestamp(CAST(eventTime AS STRING)) AS logged_time,
            CAST(NULL AS TIMESTAMP) AS modified_time,
            CAST(eventTime AS STRING) AS original_time,
            current_timestamp() AS processed_time,
            struct(
              NULLIF(CAST(eventSource AS STRING), '') AS name,
              'AWS' AS vendor_name,
              NULLIF(CAST(eventVersion AS STRING), '') AS version
            ) AS product,
            CAST(NULL AS VARIANT) AS tags,
            NULLIF(CAST(recipientAccountId AS STRING), '') AS tenant_uid,
            CAST(eventID AS STRING) AS uid,
            CAST(NULL AS STRING) AS version
          )

      # -------------------- Raw / Unmapped --------------------
      - name: raw_data
        expr: |
          CAST(to_json(struct(*)) AS VARIANT)

  - name: api_activity
    input: aws_cloudtrail_api_activity
    fields:
      # ---------------- Core classification ----------------
      - name: activity_id
        expr: |
          CASE
            WHEN eventName LIKE 'Describe%' OR eventName LIKE 'List%' OR eventName LIKE 'Get%' THEN 2
            WHEN eventName LIKE 'Create%' THEN 1
            WHEN eventName LIKE 'Delete%' THEN 4
            WHEN eventName = 'Encrypt' THEN 3
            ELSE 0
          END

      - name: activity_name
        expr: |
          CASE
            WHEN eventName LIKE 'Describe%' OR eventName LIKE 'List%' OR eventName LIKE 'Get%' THEN 'Read'
            WHEN eventName LIKE 'Create%' THEN 'Create'
            WHEN eventName LIKE 'Delete%' THEN 'Delete'
            WHEN eventName = 'Encrypt' THEN 'Update'
            ELSE NULL
          END

      - name: category_name
        literal: 'Application Activity'

      - name: category_uid
        expr: CAST(6 AS INT)

      - name: class_name
        literal: 'API Activity'

      - name: class_uid
        expr: CAST(6003 AS INT)

      - name: message
        expr: NULLIF(CAST(errorMessage AS STRING), '')

      # ---------------- Status / severity ----------------
      - name: severity
        literal: 'Informational'

      - name: severity_id
        expr: |
          CASE
            WHEN eventName LIKE 'Describe%' OR eventName LIKE 'List%' OR eventName LIKE 'Get%' OR
                 eventName LIKE 'Create%'  OR eventName LIKE 'Batch%' OR eventName LIKE 'Assume%' OR
                 eventName LIKE 'Delete%'  OR eventName IN ('GenerateCredentialReport','Encrypt','LookupEvents')
            THEN 1
            ELSE NULL
          END

      - name: status
        expr: |
          CASE WHEN CAST(errorCode AS STRING) IS NULL OR CAST(errorCode AS STRING) = '' THEN 'Success' ELSE 'Failure' END

      - name: status_code
        expr: NULLIF(CAST(errorCode AS STRING), '')

      - name: status_detail
        expr: NULLIF(CAST(errorCode AS STRING), '')

      - name: status_id
        expr: |
          CASE WHEN CAST(errorCode AS STRING) IS NULL OR CAST(errorCode AS STRING) = '' THEN 1 ELSE 2 END

      # ---------------- Timestamps ----------------
      - name: time
        expr: to_timestamp(CAST(eventTime AS STRING))

      - name: start_time
        expr: to_timestamp(CAST(eventTime AS STRING))

      - name: timezone_offset
        expr: CAST(0 AS INT)

      # ---------------- Type naming ----------------
      - name: type_name
        expr: |
          CASE
            WHEN eventName LIKE 'Create%' THEN 'Create'
            WHEN eventName LIKE 'Get%' OR eventName LIKE 'List%' OR eventName LIKE 'Describe%' OR eventName IN ('LookupEvents','GenerateCredentialReport')
              THEN 'Read'
            WHEN eventName LIKE 'Update%' OR eventName LIKE 'Put%' OR eventName LIKE 'Attach%' OR eventName LIKE 'Detach%' OR eventName LIKE 'Modify%'
              THEN 'Update'
            WHEN eventName LIKE 'Delete%' OR eventName LIKE 'Remove%' THEN 'Delete'
            ELSE 'Other'
          END

      - name: type_uid
        expr: |
          CAST(
            CASE
              WHEN eventName LIKE 'Create%' THEN 600301
              WHEN eventName LIKE 'Get%' OR eventName LIKE 'List%' OR eventName LIKE 'Describe%' OR eventName IN ('LookupEvents','GenerateCredentialReport') THEN 600302
              WHEN eventName LIKE 'Update%' OR eventName LIKE 'Put%' OR eventName LIKE 'Attach%' OR eventName LIKE 'Detach%' OR eventName LIKE 'Modify%' THEN 600303
              WHEN eventName LIKE 'Delete%' OR eventName LIKE 'Remove%' THEN 600304
              ELSE 600399
            END
          AS BIGINT)

      # ---------------- API (exact table shape) ----------------
      - name: api
        expr: |
          struct(
            CAST(
              CASE
                WHEN eventName = 'ListFunctions20150331' THEN regexp_replace(CAST(eventName AS STRING), '\\d+$', '')
                ELSE CAST(eventName AS STRING)
              END
            AS STRING) AS operation,
            struct(
              CAST(to_json(requestParameters) AS VARIANT) AS data,
              CAST(requestID AS STRING) AS uid
            ) AS request,
            struct(
              CAST(NULL AS INT) AS code,
              CAST(to_json(NULL) AS VARIANT) AS data,
              NULLIF(CAST(errorCode AS STRING), '') AS error,
              NULLIF(CAST(errorMessage AS STRING), '') AS message
            ) AS response
          )

      # ---------------- Cloud (includes cloud_partition) ----------------
      - name: cloud
        expr: |
          struct(
            struct(
              CAST(NULL AS STRING) AS name,
              COALESCE(CAST(recipientAccountId AS STRING), CAST(userIdentity.accountId AS STRING)) AS uid
            ) AS account,
            CASE
              WHEN CAST(awsRegion AS STRING) LIKE 'cn-%' THEN 'aws-cn'
              WHEN CAST(awsRegion AS STRING) LIKE 'us-gov-%' THEN 'aws-us-gov'
              ELSE 'aws'
            END AS cloud_partition,
            CAST(NULL AS STRING) AS project_uid,
            'AWS' AS provider,
            NULLIF(CAST(awsRegion AS STRING), '') AS region,
            CAST(NULL AS STRING) AS zone
          )

      # ---------------- Actor (schema-accurate) ----------------
      - name: actor
        expr: |
          struct(
            NULLIF(CAST(userAgent AS STRING), '') AS app_name,
            NULLIF(CAST(userIdentity.accessKeyId AS STRING), '') AS app_uid,
            ARRAY(
              NAMED_STRUCT('decision',
                CASE WHEN CAST(errorCode AS STRING) IS NULL OR CAST(errorCode AS STRING) = '' THEN 'allowed' ELSE 'denied' END
              )
            ) AS authorizations,
            struct(
              CAST(NULL AS STRING) AS domain,
              CAST(NULL AS STRING) AS name,
              CAST(NULL AS STRING) AS protocol_name,
              CAST(NULL AS STRING) AS tenant_uid,
              CAST(NULL AS STRING) AS uid
            ) AS idp,
            struct(
              CAST(NULL AS STRING) AS cmd_line,
              CAST(NULL AS STRING) AS cpid,
              CAST(NULL AS STRING) AS name,
              CAST(NULL AS INT) AS pid,
              struct(
                CAST(NULL AS TIMESTAMP) AS created_time,
                CAST(NULL AS STRING) AS credential_uid,
                CAST(NULL AS STRING) AS expiration_reason,
                CAST(NULL AS TIMESTAMP) AS expiration_time,
                CAST(NULL AS BOOLEAN) AS is_mfa,
                CAST(NULL AS BOOLEAN) AS is_remote,
                CAST(NULL AS BOOLEAN) AS is_vpn,
                CAST(NULL AS STRING) AS issuer,
                CAST(NULL AS STRING) AS terminal,
                CAST(NULL AS STRING) AS uid,
                CAST(NULL AS STRING) AS uid_alt,
                CAST(NULL AS STRING) AS uuid
              ) AS session,
              CAST(NULL AS STRING) AS uid,
              struct(
                CAST(NULL AS BOOLEAN) AS has_mfa,
